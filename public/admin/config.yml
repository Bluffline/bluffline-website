# Sveltia CMS configuration for thebluffline.org
# Edits JSON/Markdown files in src/content/ and commits them to GitHub.
# Keep fields in sync with the Zod schemas in src/content/config.ts.

backend:
  name: github
  repo: Bluffline/bluffline-website
  branch: main
  # Sign-in works two ways: GitHub OAuth through Netlify's OAuth provider
  # (see README "Content editing"), or a GitHub personal access token.
  base_url: https://api.netlify.com
  auth_endpoint: auth

site_url: https://thebluffline.org
display_url: https://thebluffline.org

# Uploads go here; existing images elsewhere in /images keep working as paths.
media_folder: public/images/uploads
public_folder: /images/uploads

# Drafts are controlled by each entry's own "draft" field, not editorial workflow.
publish_mode: simple

collections:
  - name: updates
    label: Progress updates
    folder: src/content/updates
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{pubDate}})"
    sortable_fields: [pubDate, title]
    fields:
      - {label: Type, name: type, widget: hidden, default: Update}
      - {label: Title, name: title, widget: string}
      - {label: Publish date, name: pubDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {label: Description, name: description, widget: text}
      - {label: Author, name: author, widget: string, required: false}
      - {label: Author title, name: authorTitle, widget: string, required: false}
      - {label: Featured image, name: featuredImage, widget: image, required: false}
      - {label: Featured image alt text, name: featuredImageAlt, widget: string, required: false}
      - {label: Tags, name: tags, widget: list, required: false, field: {label: Tag, name: tag, widget: string}}
      - {label: Project status, name: status, widget: select, required: false, options: [planning, funded, engagement, construction, complete]}
      - {label: Draft (hide from site), name: draft, widget: boolean, default: false}
      - {label: Body, name: body, widget: markdown}

  - name: press-releases
    label: Press releases
    folder: src/content/press-releases
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{pubDate}})"
    sortable_fields: [pubDate, title]
    fields:
      - {label: Type, name: type, widget: hidden, default: PressRelease}
      - {label: Title, name: title, widget: string}
      - {label: Publish date, name: pubDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {label: Summary, name: summary, widget: text}
      - {label: Contact name, name: contactName, widget: string, required: false}
      - {label: Contact email, name: contactEmail, widget: string, required: false}
      - {label: Contact phone, name: contactPhone, widget: string, required: false}
      - {label: Draft (hide from site), name: draft, widget: boolean, default: false}
      - label: Media
        name: media
        widget: list
        required: false
        fields:
          - {label: File path, name: src, widget: image}
          - {label: Alt text, name: alt, widget: string, required: false}
          - {label: Caption, name: caption, widget: string, required: false}
          - {label: Credit, name: credit, widget: string, required: false}
          - {label: Media type, name: type, widget: select, options: [image, video, audio], default: image}
      - {label: Body, name: body, widget: markdown}

  - name: defender-award-recipients
    label: Defender Award recipients
    folder: src/content/defender-award-recipients
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - {label: Type, name: type, widget: hidden, default: DefenderAwardRecipient}
      - {label: Name, name: name, widget: string}
      - {label: Title, name: title, widget: string}
      - {label: Year, name: year, widget: number, value_type: int}
      - {label: Photo, name: photo, widget: image, required: false}
      - {label: Summary, name: summary, widget: text}
      - {label: Award object description, name: awardObjectDescription, widget: text, required: false}
      - {label: Draft (hide from site), name: draft, widget: boolean, default: false}
      - {label: Body, name: body, widget: markdown}

  - name: board-members
    label: Board & staff
    folder: src/content/board-members
    extension: json
    format: json
    create: true
    slug: "{{firstName}}-{{lastName}}"
    summary: "{{firstName}} {{lastName}} ({{role}})"
    fields:
      - {label: Type, name: type, widget: hidden, default: BoardMember}
      - {label: First name, name: firstName, widget: string}
      - {label: Last name, name: lastName, widget: string}
      - {label: Suffix, name: suffix, widget: string, required: false}
      - {label: Title, name: title, widget: string}
      - {label: Role, name: role, widget: select, options: [chair, vice-president, treasurer, secretary, board-member, staff, emeritus]}
      - {label: Bio, name: bio, widget: text}
      - {label: Photo, name: photo, widget: image, required: false}
      - {label: Archived (hide from site), name: archived, widget: boolean, required: false}

  - name: testimonials
    label: Letters of support
    folder: src/content/testimonials
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    summary: "{{author}}, {{organization}}"
    fields:
      - {label: Type, name: type, widget: hidden, default: Testimonial}
      - {label: Quote, name: quote, widget: text}
      - {label: Author, name: author, widget: string}
      - {label: Title, name: title, widget: string}
      - {label: Organization, name: organization, widget: string}
      - {label: Organization link, name: organizationLink, widget: string, required: false, hint: "Full URL, starting with https://"}
      - {label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false}
      - {label: Letter PDF path, name: pdfFile, widget: string, hint: "e.g. /documents/letters/Example.pdf"}
      - {label: Order, name: order, widget: number, value_type: int, required: false}

  - name: press
    label: Press coverage
    folder: src/content/press
    extension: json
    format: json
    create: true
    slug: "press-{{outlet}}-{{date}}"
    summary: "{{outlet}}: {{title}}"
    fields:
      - {label: Type, name: type, widget: hidden, default: Press}
      - {label: Outlet, name: outlet, widget: string}
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {label: Link, name: link, widget: string, hint: "Full URL, starting with https://"}
      - {label: Media type, name: mediaType, widget: select, options: [article, radio, tv, podcast], default: article}

  - name: documents
    label: Plans & documents
    folder: src/content/documents
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Type, name: type, widget: hidden, default: Document}
      - {label: Title, name: title, widget: string}
      - {label: Agency, name: agency, widget: string}
      - {label: Year, name: year, widget: number, value_type: int}
      - {label: Document type, name: documentType, widget: select, options: [plan, study, policy, report]}
      - {label: Level, name: level, widget: select, required: false, options: [federal, state, regional, county, city]}
      - {label: Link, name: link, widget: string, required: false, hint: "Full URL, starting with https://"}
      - {label: File path, name: file, widget: string, required: false}
      - {label: Description, name: description, widget: text, required: false}

  - name: resources
    label: Corridor resources
    folder: src/content/resources
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Type, name: type, widget: hidden, default: Resource}
      - {label: Name, name: name, widget: string}
      - {label: Description, name: description, widget: text}
      - {label: Qualities, name: qualities, widget: select, multiple: true, options: [Cultural, Historical, Archaeological, Recreational, Natural, Scenic]}
      - label: Coordinates
        name: coordinates
        widget: object
        required: false
        fields:
          - {label: Latitude, name: lat, widget: number, value_type: float}
          - {label: Longitude, name: lng, widget: number, value_type: float}

  - name: timeline
    label: History timeline
    folder: src/content/timeline
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    fields:
      - {label: Type, name: type, widget: hidden, default: TimelineEntry}
      - {label: Date, name: date, widget: string, hint: "Free text, e.g. 2021"}
      - {label: Title, name: title, widget: string}
      - {label: Description, name: description, widget: text}
      - {label: Order, name: order, widget: number, value_type: int}
      - label: Images
        name: images
        widget: list
        required: false
        fields:
          - {label: Image, name: src, widget: image}
          - {label: Alt text, name: alt, widget: string}
          - {label: Caption, name: caption, widget: string, required: false}
          - {label: Credit, name: credit, widget: string, required: false}

