[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Clean URL for the ChatKit session endpoint
[[redirects]]
  from = "/api/chatkit/session"
  to = "/.netlify/functions/chatkit-session"
  status = 200

# GitHub OAuth proxy for the /admin CMS login
[[redirects]]
  from = "/api/auth/callback"
  to = "/.netlify/functions/cms-auth"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/cms-auth"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
